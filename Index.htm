<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodega Shekinah</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #6a1b9a;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      padding: 20px 16px 90px;
      max-width: 600px;
      margin: auto;
    }

    .welcome {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      margin-top: 0;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .menu button {
      border: none;
      border-radius: 16px;
      padding: 25px 10px;
      background: white;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .menu button:active {
      transform: scale(0.97);
    }

    .icon {
      display: block;
      font-size: 32px;
      margin-bottom: 8px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px;
      text-align: center;
      border-top: 1px solid #ddd;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🏪 Bodega Shekinah</h1>
    <p>Tu bodega, organizada y fácil de administrar</p>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>¡Bienvenida!</h2>
      <p>
        Desde aquí podrás controlar tus productos, inventario y ventas.
      </p>
    </section>

    <section class="menu">

      <button onclick="alert('Módulo de Inventario próximamente')">
        <span class="icon">📦</span>
        Inventario
      </button>

      <button onclick="alert('Módulo de Ventas próximamente')">
        <span class="icon">🛒</span>
        Ventas
      </button>

      <button onclick="alert('Módulo de Productos próximamente')">
        <span class="icon">🏷️</span>
        Productos
      </button>

      <button onclick="alert('Configuración próximamente')">
        <span class="icon">⚙️</span>
        Configuración
      </button>

    </section>

  </main>

  <footer>
    Bodega Shekinah © 2026
  </footer>

</body>
</html>
